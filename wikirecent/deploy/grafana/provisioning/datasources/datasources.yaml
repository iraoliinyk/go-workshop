apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Both reference dashboards hard-code this uid in every target. A different uid
    # gives "Datasource not found" on every panel.
    uid: PBFA97CFB590B2093
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
    editable: false
    