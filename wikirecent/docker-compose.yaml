x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: wikistats-go:latest
  env_file:
    - .env
  restart: unless-stopped

# Three nodes, because RF is 3 and the app queries at QUORUM. QUORUM of RF 3 is two
# replicas, so a smaller cluster would create the keyspace and then fail every query.
x-cassandra: &cassandra
  image: cassandra:5.0.8
  environment: &cassandra-env
    CASSANDRA_CLUSTER_NAME: wikistream
    # Two, so a restarting node can still find the cluster when cassandra1 is down.
    # The cost is that a seed never bootstraps: wiping cassandra2's volume alone
    # would let it rejoin empty and stream nothing, and its share of the rows would
    # read as missing until `nodetool repair`. Wipe all three, or none.
    CASSANDRA_SEEDS: cassandra1,cassandra2
    # Not SimpleSnitch: that one hardcodes datacenter1/rack1 and ignores
    # cassandra-rackdc.properties, which would silently drop the two settings below
    # and leave every node in one rack.
    CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    CASSANDRA_DC: ${CASSANDRA_DC:-dc1}
    MAX_HEAP_SIZE: 512M
    HEAP_NEWSIZE: 100M
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "cqlsh -e 'SELECT bootstrapped FROM system.local' | grep -q COMPLETED"]
    interval: 15s
    timeout: 10s
    retries: 20
    start_period: 60s

services:
  cassandra1:
    <<: *cassandra
    environment:
      <<: *cassandra-env
      CASSANDRA_RACK: rack1
    # The only published node. The other two are reachable on the compose network,
    # which is where the driver finds them after gossip.
    ports:
      - "${CASSANDRA_HOST_PORT:-9042}:9042"
    volumes:
      - cassandra1-data:/var/lib/cassandra

  # Chained on purpose, so the nodes join one at a time: a seed has to answer before
  # another node looks for it, and Cassandra refuses to bootstrap a node while
  # another is already joining unless consistent_rangemovement is off.
  cassandra2:
    <<: *cassandra
    environment:
      <<: *cassandra-env
      CASSANDRA_RACK: rack2
    volumes:
      - cassandra2-data:/var/lib/cassandra
    depends_on:
      cassandra1:
        condition: service_healthy

  cassandra3:
    <<: *cassandra
    environment:
      <<: *cassandra-env
      CASSANDRA_RACK: rack3
    volumes:
      - cassandra3-data:/var/lib/cassandra
    depends_on:
      cassandra2:
        condition: service_healthy

  # No container_name on any of the services above or below.
  # Reach them by service name: `docker compose exec redpanda rpk cluster info`.
  redpanda:
    image: redpandadata/redpanda:v25.1.7
    command:
      - redpanda
      - start
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  console:
    image: redpandadata/console:v3.10.0
    ports:
      - "8080:8080"
    environment:
      CONFIG_FILEPATH: /etc/console/console.yaml
    volumes:
      - ./deploy/console/console.yaml:/etc/console/console.yaml:ro
      - ./proto:/etc/protos:ro
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  # Run-once container that creates the topic before either service starts.
  # Explicit creation, not auto-create: the topic settings should be visible here
  # rather than inherited from cluster defaults that may change.
  redpanda-init:
    image: redpandadata/redpanda:v25.1.7
    entrypoint: ["/bin/sh", "-c"]
    # retention.ms=86400000 is 24h. The default is 7 days, which is a lot for the workshop.
    #
    # Every line below must keep the same indentation. A `>-` block does NOT fold a
    # more-indented line, so one extra space splits this into several shell commands.
    #
    # The describe fallback is what makes a re-run idempotent: create exits 1 on
    # TOPIC_ALREADY_EXISTS. Plain `|| true` would also hide a broken command.
    command:
      - >-
        rpk topic create ${REDPANDA_TOPIC:-wiki.recentchange.proto}
        -p ${REDPANDA_PARTITIONS:-3}  -r ${REDPANDA_REPLICAS:-1} 
        --topic-config cleanup.policy=delete
        --topic-config retention.ms=86400000
        --topic-config retention.bytes=536870912
        --topic-config compression.type=producer
        --topic-config message.timestamp.type=CreateTime
        --brokers redpanda:9092
        || rpk topic describe ${REDPANDA_TOPIC:-wiki.recentchange.proto}
        --brokers redpanda:9092

    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  producer:
    <<: *app
    command: ["/app/wiki-producer"]
    environment:
      REDPANDA_BROKERS: "redpanda:9092"
    depends_on:
      # Waits for the topic, not just for the broker. Publisher.Connect only
      # pings, so a missing topic would not fail at startup.
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # cmd/producer serves exactly one route, GET /liveness, for this line.
      # Same call as the consumer: /bin/busybox wget, since scratch has no wget.
      test: ["CMD", "/bin/busybox", "wget", "-q", "--spider", "-T", "3", "http://127.0.0.1:${PRODUCER_PORT:-7002}/liveness"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  consumer:
    <<: *app
    command: ["/app/wiki-consumer"]
    environment:
      REDPANDA_BROKERS: "redpanda:9092"
      # All three, so a contact point remains when one node is down.
      CASSANDRA_HOSTS: cassandra1,cassandra2,cassandra3
      CASSANDRA_LOCAL_DC: ${CASSANDRA_DC:-dc1}
      CASSANDRA_REPLICATION_FACTOR: ${CASSANDRA_REPLICATION_FACTOR:-3}
      DB_BACKEND: ${DB_BACKEND:-cassandra}
    depends_on:
      # All three: the app creates the keyspace at RF 3 on startup and then queries at
      # QUORUM, so waiting for one node would let it start against a cluster that
      # cannot answer. Neither binary retries its first connection.
      cassandra1:
        condition: service_healthy
      cassandra2:
        condition: service_healthy
      cassandra3:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    ports:
      - "${CONSUMER_PORT:-7001}:${CONSUMER_PORT:-7001}"
    restart: unless-stopped
    # Must exceed cmd/consumer's shutdownTimeout of 15s. 
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "--spider", "-T", "3", "http://127.0.0.1:${CONSUMER_PORT:-7001}/status"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 6h is plenty for a workshop and keeps the volume small.
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - producer
      - consumer
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  # One per node. Sharing one would give all three the same system tables and token
  # ranges, and the cluster would never form.
  cassandra1-data:
  cassandra2-data:
  cassandra3-data:
  # to keep it separate from container writable layer
  redpanda-data:
  prometheus-data:
  grafana-data:
