name: CD (wiki)
run-name: Publish image for ${{ github.event.workflow_run.head_branch || github.ref_name }}

on:
  # Runs only after CI (wiki) finishes.
  workflow_run:
    workflows: ['CI (wiki)']
    types:
      - completed
  # Manual re-publish of the current main.
  workflow_dispatch:

permissions:
  # package deal for permissions.packages: write
  contents: read
  # lets docker/login-action + push: true write to ghcr.io with the automatic GITHUB_TOKEN
  packages: write

jobs:
  publishImage:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v7
        with:
          # Publish exactly the commit CI validated, not whatever main points at
          # by the time this workflow starts.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Docker Buildx
        # No QEMU step — see the note in wiki-ci.yml's dockerBuild job: the
        # Dockerfile cross-compiles, so no stage runs on a foreign architecture.
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR (Github Container Registry)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/wiki-recent-go
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,value=${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          # The Dockerfile copies go.mod/go.sum from the build context, so the
          # context must be the module directory rather than the repo root.
          context: wikirecent
          file: wikirecent/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
