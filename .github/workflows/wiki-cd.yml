name: CD (ch-4)
run-name: Publish ch-4 image for ${{ github.event.workflow_run.head_branch || github.ref_name }}

on:
  # Runs only after CI (ch-4) finishes on main; the `if` below filters out
  # failed runs and non-main branches.
  workflow_run:
    workflows: ['CI (ch-4)']
    types:
      - completed
  # Manual re-publish of the current main.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publishImage:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v5
        with:
          # Publish exactly the commit CI validated, not whatever main points at
          # by the time this workflow starts.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wiki-recent-go
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,value=${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          # The Dockerfile copies go.mod/go.sum from the build context, so the
          # context must be ch-4 rather than the repo root.
          context: ch-4
          file: ch-4/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
