name: CD (wiki)
run-name: Publish image for ${{ github.event.workflow_run.head_branch || github.ref_name }}

on:
  # Runs only after CI (wiki) finishes on main; the `if` below filters out
  # failed runs and non-main branches.
  workflow_run:
    workflows: ['CI (wiki)']
    types:
      - completed
  # Manual re-publish of the current main.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publishImage:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v7
        with:
          # Publish exactly the commit CI validated, not whatever main points at
          # by the time this workflow starts.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Resolve chapter directory
        id: resolve
        # This workflow only ever publishes main, which is not a chapter branch,
        # so the chapter is the highest-numbered ch-* directory in the tree — the
        # newest chapter merged. Mirrors the resolveChapter job in wiki-ci.yml.
        run: |
          chapter=$(ls -d ch-*/ 2>/dev/null | tr -d '/' | sort -V | tail -1)
          if [[ -z "$chapter" || ! -f "$chapter/Dockerfile" ]]; then
            echo "::error::no publishable chapter resolved (got '$chapter')"
            exit 1
          fi
          echo "chapter=$chapter" >> "$GITHUB_OUTPUT"
          echo "Publishing \`$chapter\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/wiki-recent-go
          # The chapter tag keeps every published chapter addressable after the
          # `main` tag has moved on to a later one.
          tags: |
            type=raw,value=main
            type=raw,value=${{ steps.resolve.outputs.chapter }}
            type=sha,prefix=sha-,value=${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          # The Dockerfile copies go.mod/go.sum from the build context, so the
          # context must be the chapter directory rather than the repo root.
          context: ${{ steps.resolve.outputs.chapter }}
          file: ${{ steps.resolve.outputs.chapter }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
