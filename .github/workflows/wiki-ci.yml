name: CI (wiki)
run-name: CI on ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches:
      - main
      - 'ch-*'
    # Path filters cannot use expressions, so they match every chapter and the
    # resolveChapter job narrows it down to the one this run actually builds.
    paths:
      - 'ch-*/**'
      - '.github/workflows/wiki-ci.yml'
  pull_request:
    branches:
      - main
      - 'ch-*'
    paths:
      - 'ch-*/**'
      - '.github/workflows/wiki-ci.yml'

permissions:
  contents: read

jobs:
  resolveChapter:
    # Every chapter is its own Go module in its own directory, and a chapter
    # branch is named after the directory it adds (ch-4 -> ch-4/).
    runs-on: ubuntu-latest
    outputs:
      chapter: ${{ steps.resolve.outputs.chapter }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve chapter directory
        id: resolve
        # The branch name goes through env rather than direct interpolation, so a
        # branch containing shell metacharacters cannot inject into this script.
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [[ "$BRANCH" =~ ^ch-[0-9]+$ ]]; then
            chapter="$BRANCH"
          else
            chapter=$(ls -d ch-*/ 2>/dev/null | tr -d '/' | sort -V | tail -1)
          fi
          if [[ -z "$chapter" || ! -f "$chapter/go.mod" ]]; then
            echo "::error::no chapter module resolved for branch '$BRANCH' (got '$chapter')"
            exit 1
          fi
          echo "chapter=$chapter" >> "$GITHUB_OUTPUT"
          echo "Building \`$chapter\`" >> "$GITHUB_STEP_SUMMARY"

  lint:
    needs: resolveChapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ needs.resolveChapter.outputs.chapter }}/go.mod
          cache-dependency-path: ${{ needs.resolveChapter.outputs.chapter }}/go.sum
      - name: Run golangci-lint
        # Installs golangci-lint and runs it. `install-mode` is left at its default
        # of `binary`, which downloads the prebuilt release — far faster than the
        # `goinstall` mode, and the only one upstream considers reliable: building
        # from sources compiles against whatever Go version the runner happens to
        # have and can resolve dependencies that were never tested together.
        # https://golangci-lint.run/docs/welcome/install/local/#install-from-sources
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ${{ needs.resolveChapter.outputs.chapter }}

  unitTest:
    needs: resolveChapter
    runs-on: ubuntu-latest
    # The module lives in the chapter directory, not at the repo root, so every
    # run step needs to start there. Action inputs are not covered by this and
    # take explicit paths.
    defaults:
      run:
        working-directory: ${{ needs.resolveChapter.outputs.chapter }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ needs.resolveChapter.outputs.chapter }}/go.mod
          cache-dependency-path: ${{ needs.resolveChapter.outputs.chapter }}/go.sum
      - name: Run unit tests
        # No -tags=integration, so the build-tagged Cassandra tests are excluded.
        run: go test -race ./...

  integrationTest:
    needs: resolveChapter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ needs.resolveChapter.outputs.chapter }}
    services:
      # Same node docker-compose.yaml provides locally. A service container is used
      # instead of `docker compose up cassandra` because the compose file's wiki
      # service reads an env_file (.env) that is not committed.
      cassandra:
        image: cassandra:5.0.8
        ports:
          - 9042:9042
        env:
          CASSANDRA_CLUSTER_NAME: wikistream
          MAX_HEAP_SIZE: 512M
          HEAP_NEWSIZE: 100M
        options: >-
          --health-cmd "cqlsh -e 'SELECT bootstrapped FROM system.local' | grep -q COMPLETED"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ needs.resolveChapter.outputs.chapter }}/go.mod
          cache-dependency-path: ${{ needs.resolveChapter.outputs.chapter }}/go.sum
      - name: Run integration tests
        env:
          CASSANDRA_HOSTS: 127.0.0.1:9042
        run: go test -tags=integration ./...

  dockerBuild:
    # Build only. No registry login and no push, just to prove the
    # image still compiles. Publishing is handled by wiki-cd.yml.
    needs: resolveChapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          # The Dockerfile copies go.mod/go.sum from the build context, so the
          # context must be the chapter directory rather than the repo root.
          context: ${{ needs.resolveChapter.outputs.chapter }}
          file: ${{ needs.resolveChapter.outputs.chapter }}/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
