name: CI (wiki)
run-name: CI on ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches:
      - main
      - 'ch-*'
    paths:
      - 'wikirecent/**'
      - '.github/workflows/wiki-ci.yml'
  pull_request:
    branches:
      - main
      - 'ch-*'
    paths:
      - 'wikirecent/**'
      - '.github/workflows/wiki-ci.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: wikirecent/go.mod
          cache-dependency-path: wikirecent/go.sum
      - name: Run golangci-lint
        # Installs golangci-lint and runs it. As it downloads the prebuilt release
        # — far faster than the `goinstall` mode.
        # https://golangci-lint.run/docs/welcome/install/local/#install-from-sources
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: wikirecent

  unitTest:
    runs-on: ubuntu-latest
    # The module lives in wikirecent/, not at the repo root, so every run step
    # needs to start there. Action inputs are not covered by this and take
    # explicit paths.
    defaults:
      run:
        working-directory: wikirecent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: wikirecent/go.mod
          cache-dependency-path: wikirecent/go.sum
      - name: Run unit tests
        # No -tags=integration, so the build-tagged Cassandra tests are excluded.
        run: go test -race ./...

  integrationTest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wikirecent
    services:
      # Same node docker-compose.yaml provides locally. A service container is used
      # instead of `docker compose up cassandra` because the compose file's wiki
      # service reads an env_file (.env) that is not committed.
      cassandra:
        image: cassandra:5.0.8
        ports:
          - 9042:9042
        env:
          CASSANDRA_CLUSTER_NAME: wikistream
          MAX_HEAP_SIZE: 512M
          HEAP_NEWSIZE: 100M
        options: >-
          --health-cmd "cqlsh -e 'SELECT bootstrapped FROM system.local' | grep -q COMPLETED"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: wikirecent/go.mod
          cache-dependency-path: wikirecent/go.sum
      - name: Run integration tests
        env:
          CASSANDRA_HOSTS: 127.0.0.1:9042
        run: go test -tags=integration ./...

  dockerBuild:
    # Build only. No registry login and no push, just to prove the
    # image still compiles. Publishing is handled by wiki-cd.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        # The Dockerfile pins its build stage to BUILDPLATFORM.
        # So the scratch stage only copies files, and
        # nothing ever executes on the non-native architecture.
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          # The Dockerfile copies go.mod/go.sum from the build context, so the
          # context must be the module directory rather than the repo root.
          context: wikirecent
          file: wikirecent/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
