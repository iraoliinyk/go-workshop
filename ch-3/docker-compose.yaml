services:
  cassandra:
    image: cassandra:5.0.8
    container_name: cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: wikistream
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    ports:
      - "${CASSANDRA_HOST_PORT:-9042}:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT bootstrapped FROM system.local' | grep -q COMPLETED"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s  

  wiki:
    build:
      context: .
      dockerfile: Dockerfile
    image: wiki-recent-go:latest
    container_name: wiki-recent
    env_file:
      - .env
    environment:
      CASSANDRA_HOSTS: cassandra
    depends_on:
      cassandra:
        # main.go has no connect retry for now, so the app must not start
        # before the node answers queries.
        condition: service_healthy
    ports:
      - "${CONSUMER_PORT:-7001}:${CONSUMER_PORT:-7001}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:${CONSUMER_PORT:-7001}/status"]
      interval: 30s     
      timeout: 3s       
      retries: 3        
      start_period: 5s  

volumes:
  cassandra-data:
